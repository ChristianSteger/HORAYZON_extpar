[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "Cython>=3.0",
    "numpy>=1.23",
    # No aarch64 wheels of tbb/tbb-devel exist on PyPI; on aarch64, TBB is
    # built from source and bundled into the wheel (see cibuildwheel overrides)
    "tbb-devel==2023.1.0; platform_machine == 'x86_64'",
]
build-backend = "setuptools.build_meta"

[project]
name = "horayzon-extpar"
version = "2.2.0"
description = "Embree ray tracing interface to compute grid- and subgrid-scale terrain horizon for ICON grids"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Christian Steger" }]
dependencies = [
    "numpy>=1.23",
    "tbb==2023.1.0; platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/ChristianSteger/HORAYZON_extpar"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["horayzon_extpar"]

[tool.setuptools.package-data]
horayzon_extpar = ["*.pyx", "*.h", "*.cpp"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux*"
archs = ["native"]  # x86_64 or aarch64, depending on the CI runner
build-verbosity = 1
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-command = "python -c \"import horayzon_extpar; print(horayzon_extpar.Terrain)\""

[tool.cibuildwheel.linux]
repair-wheel-command = [
    "LD_LIBRARY_PATH=\"{project}/.embree_cache/embree-4.4.1/lib64:$LD_LIBRARY_PATH\" auditwheel repair --exclude libtbb.so.12 -w {dest_dir} {wheel}",
]

# Linux aarch64: neither Embree (no prebuilt Linux arm64 release) nor TBB (no
# aarch64 wheels on PyPI) is available prebuilt, so both are compiled from
# source once per container (shared by all Python versions) and bundled into
# the wheel by auditwheel (no '--exclude libtbb').
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_aarch64"
before-all = [
    "set -eux",
    "/opt/python/cp312-cp312/bin/python -m pip install cmake ninja",
    "export PATH=/opt/python/cp312-cp312/bin:$PATH",
    "mkdir -p /tmp/src && cd /tmp/src",
    "curl -fsSL https://github.com/uxlfoundation/oneTBB/archive/refs/tags/v2023.1.0.tar.gz | tar xz",
    "cmake -S oneTBB-2023.1.0 -B build-tbb -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/deps -DCMAKE_INSTALL_LIBDIR=lib -DTBB_TEST=OFF -DTBB_STRICT=OFF",
    "cmake --build build-tbb --target install",
    "curl -fsSL https://github.com/RenderKit/embree/archive/refs/tags/v4.4.1.tar.gz | tar xz",
    "cmake -S embree-4.4.1 -B build-embree -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/deps -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_PREFIX_PATH=/opt/deps -DEMBREE_TBB_ROOT=/opt/deps -DEMBREE_TASKING_SYSTEM=TBB -DEMBREE_ISPC_SUPPORT=OFF -DEMBREE_TUTORIALS=OFF",
    "cmake --build build-embree --target install",
]
environment = { EMBREE_DIR = "/opt/deps", TBB_ROOT = "/opt/deps" }
repair-wheel-command = "LD_LIBRARY_PATH=/opt/deps/lib:$LD_LIBRARY_PATH auditwheel repair -w {dest_dir} {wheel}"
